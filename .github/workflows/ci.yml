name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  worker:
    name: Worker (typecheck, lint, tests, bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -w @ghc/mcp-worker
      # Validates wrangler.jsonc + bundles the Worker without deploying or needing credentials.
      - run: npx wrangler deploy --dry-run --outdir /tmp/dryrun
        working-directory: apps/mcp-worker

  parser:
    name: Parser (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/parser-service/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: pip install -r ingestion/parser-service/requirements-dev.txt
      - run: python -m pytest ingestion/parser-service/tests -q

  contract:
    name: Python payloads are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r ingestion/parser-service/requirements.txt
      - run: python tests/fixtures/synthetic/export_payloads.py
      - name: Fixture must be committed in sync with the parser
        run: git diff --exit-code tests/fixtures/synthetic/parser_payloads.json
